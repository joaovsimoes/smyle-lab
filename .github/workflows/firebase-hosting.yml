name: Publicar Smyle Lab no Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v4

      - name: Preparar Smyle Lab
        shell: bash
        run: |
          if [ -f "Smyle_Lab_Firebase_smyle-lab.zip" ]; then
            rm -rf public
            unzip -o "Smyle_Lab_Firebase_smyle-lab.zip"
          fi

          if [ ! -f "public/index.html" ]; then
            echo "ERRO: public/index.html não foi encontrado."
            echo "Envie o arquivo Smyle_Lab_Firebase_smyle-lab.zip para a raiz do repositório."
            exit 1
          fi

      - name: Aplicar base estável e correção isolada
        shell: bash
        run: |
          python3 scripts/patch-admin-access.py
          python3 scripts/fix-v30-boot.py
          python3 scripts/patch-v32-premium.py
          python3 scripts/patch-v33-ui.py
          python3 scripts/patch-v34-brand-modals.py
          python3 scripts/patch-v35-compact.py
          python3 scripts/patch-v37-content-modal-success.py
          python3 scripts/patch-v38-modal-balance.py
          python3 scripts/patch-v39-user-management.py
          python3 scripts/patch-v47-safe-permissions.py
          python3 scripts/patch-v48-primary-admin-status.py
          python3 scripts/patch-v49-local-core-repair.py
          python3 scripts/patch-v36-script-integrity.py
          python3 scripts/patch-v61-next-game-button-only.py
          python3 scripts/patch-v62-dynamic-questions-and-game-times.py
          python3 scripts/patch-v63-official-favicon.py
          python3 scripts/patch-v64-official-title.py
          python3 scripts/patch-v64-site-title.py
          python3 scripts/patch-v65-cloud-content-sync.py

      - name: Publicar regras do Firestore
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMYLE_LAB }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          cp firestore.rules "$RUNNER_TEMP/firestore.rules"
          cat > "$RUNNER_TEMP/firebase-firestore.json" <<'JSON'
          {
            "firestore": {
              "rules": "firestore.rules"
            }
          }
          JSON
          npx --yes firebase-tools@14.12.1 deploy --config "$RUNNER_TEMP/firebase-firestore.json" --only firestore:rules --project smyle-lab --non-interactive || echo "::warning::Conta de deploy sem permissão para publicar regras; testando autenticação do app."

      - name: Testar autenticação e Firestore
        shell: bash
        run: |
          set +e
          echo "=== FIREBASE CLIENT INIT ==="
          curl -sS "https://smyle-lab.web.app/__/firebase/init.json" -o "$RUNNER_TEMP/firebase-init.json"
          cat "$RUNNER_TEMP/firebase-init.json"
          echo
          API_KEY=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/firebase-init.json')).get('apiKey',''))")
          echo "API_KEY_PRESENT=$([ -n "$API_KEY" ] && echo yes || echo no)"

          echo "=== ANONYMOUS AUTH ==="
          AUTH_CODE=$(curl -sS -o "$RUNNER_TEMP/auth.json" -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"returnSecureToken":true}' \
            "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$API_KEY")
          echo "AUTH_STATUS=$AUTH_CODE"
          python3 - <<'PY'
          import json, os
          p=os.environ.get('RUNNER_TEMP')+'/auth.json'
          try:
              d=json.load(open(p))
              print('AUTH_ERROR=', d.get('error',{}).get('message',''))
              print('HAS_ID_TOKEN=', bool(d.get('idToken')))
          except Exception as e:
              print('AUTH_PARSE_ERROR=',e)
          PY

          ID_TOKEN=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/auth.json')).get('idToken',''))" 2>/dev/null)
          if [ -n "$ID_TOKEN" ]; then
            echo "=== AUTHENTICATED FIRESTORE READ ==="
            READ_CODE=$(curl -sS -o "$RUNNER_TEMP/firestore-auth.json" -w "%{http_code}" \
              -H "Authorization: Bearer $ID_TOKEN" \
              "https://firestore.googleapis.com/v1/projects/smyle-lab/databases/(default)/documents/smyleShared/gameContent")
            echo "AUTH_READ_STATUS=$READ_CODE"
            head -c 800 "$RUNNER_TEMP/firestore-auth.json" || true
            echo

            echo "=== AUTHENTICATED FIRESTORE WRITE PROBE ==="
            WRITE_CODE=$(curl -sS -o "$RUNNER_TEMP/firestore-write.json" -w "%{http_code}" \
              -X PATCH \
              -H "Authorization: Bearer $ID_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"fields":{"probe":{"stringValue":"ok"}}}' \
              "https://firestore.googleapis.com/v1/projects/smyle-lab/databases/(default)/documents/smyleShared/permissionProbe")
            echo "AUTH_WRITE_STATUS=$WRITE_CODE"
            head -c 800 "$RUNNER_TEMP/firestore-write.json" || true
            echo
            if [ "$WRITE_CODE" = "200" ]; then
              curl -sS -X DELETE -H "Authorization: Bearer $ID_TOKEN" \
                "https://firestore.googleapis.com/v1/projects/smyle-lab/databases/(default)/documents/smyleShared/permissionProbe" >/dev/null
            fi
          fi
          echo "=== END AUTH/FIRESTORE TEST ==="
          exit 0

      - name: Publicar no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMYLE_LAB }}
          channelId: live
          projectId: smyle-lab
