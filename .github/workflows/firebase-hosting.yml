name: Publicar Smyle Lab no Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v4

      - name: Preparar Smyle Lab
        shell: bash
        run: |
          if [ -f "Smyle_Lab_Firebase_smyle-lab.zip" ]; then
            rm -rf public
            unzip -o "Smyle_Lab_Firebase_smyle-lab.zip"
          fi

          if [ ! -f "public/index.html" ]; then
            echo "ERRO: public/index.html não foi encontrado."
            echo "Envie o arquivo Smyle_Lab_Firebase_smyle-lab.zip para a raiz do repositório."
            exit 1
          fi

      - name: Aplicar base estável e correção isolada
        shell: bash
        run: |
          python3 scripts/patch-admin-access.py
          python3 scripts/fix-v30-boot.py
          python3 scripts/patch-v32-premium.py
          python3 scripts/patch-v33-ui.py
          python3 scripts/patch-v34-brand-modals.py
          python3 scripts/patch-v35-compact.py
          python3 scripts/patch-v37-content-modal-success.py
          python3 scripts/patch-v38-modal-balance.py
          python3 scripts/patch-v39-user-management.py
          python3 scripts/patch-v47-safe-permissions.py
          python3 scripts/patch-v48-primary-admin-status.py
          python3 scripts/patch-v49-local-core-repair.py
          python3 scripts/patch-v36-script-integrity.py
          python3 scripts/patch-v61-next-game-button-only.py
          python3 scripts/patch-v62-dynamic-questions-and-game-times.py
          python3 scripts/patch-v63-official-favicon.py
          python3 scripts/patch-v64-official-title.py
          python3 scripts/patch-v64-site-title.py
          python3 scripts/patch-v65-cloud-content-sync.py
          python3 scripts/patch-v66-authoritative-cloud-content.py
          python3 scripts/patch-v67-admin-authoritative-sync.py

      - name: Publicar regras do Firestore
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMYLE_LAB }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          cp firestore.rules "$RUNNER_TEMP/firestore.rules"
          cat > "$RUNNER_TEMP/firebase-firestore.json" <<'JSON'
          {
            "firestore": {
              "rules": "firestore.rules"
            }
          }
          JSON
          npx --yes firebase-tools@14.12.1 deploy --config "$RUNNER_TEMP/firebase-firestore.json" --only firestore:rules --project smyle-lab --non-interactive || echo "::warning::Conta de deploy sem permissão para publicar regras; testando autenticação do app."

      - name: Auditar conteúdo compartilhado
        shell: bash
        run: |
          set +e
          code=$(curl -sS -o "$RUNNER_TEMP/smyle-shared.json" -w "%{http_code}" "https://firestore.googleapis.com/v1/projects/smyle-lab/databases/(default)/documents/smyleShared/gameContent")
          echo "SHARED_DOC_STATUS=$code"
          python3 - <<'PY'
          import json, os
          p=os.environ['RUNNER_TEMP']+'/smyle-shared.json'
          try:
              doc=json.load(open(p,encoding='utf-8'))
              raw=doc.get('fields',{}).get('contentJson',{}).get('stringValue')
              if not raw:
                  print('SHARED_DOC_PRESENT=no')
              else:
                  data=json.loads(raw)
                  print('SHARED_DOC_PRESENT=yes')
                  qs=json.loads(data.get('dojo_questions_v1','[]'))
                  native=json.loads(data.get('smyle_lab_native_content_v17','{}'))
                  print('CLOUD_FATO_FAKE_COUNT='+str(len(qs) if isinstance(qs,list) else -1))
                  if isinstance(native,dict):
                      for k,v in native.items():
                          print('CLOUD_'+str(k).upper().replace('-','_')+'_COUNT='+str(len(v) if isinstance(v,list) else -1))
                  print('CLOUD_VERSION='+str(doc.get('fields',{}).get('version',{}).get('integerValue','')))
                  print('CLOUD_UPDATED_AT='+str(doc.get('fields',{}).get('updatedAt',{}).get('timestampValue','')))
          except Exception as e:
              print('SHARED_DOC_PARSE_ERROR='+repr(e))
          PY

      - name: Publicar no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMYLE_LAB }}
          channelId: live
          projectId: smyle-lab
